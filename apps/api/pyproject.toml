[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisforge"
version = "0.2.0"
description = "Autonomous AI cloud operations and defense platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Michael Opoku-Gyimah"}]
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "slowapi>=0.1.9",
    "PyGithub>=2.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "bandit>=1.7",
    "httpx>=0.27",
]
llm = [
    "anthropic>=0.34",
    "openai>=1.30",
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=aegisforge --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E","F","W","I","B","UP","ASYNC","S","RUF"]
ignore = ["S101","S104"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S","B"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
